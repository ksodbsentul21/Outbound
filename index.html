<!doctype html>
<html lang="id">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta name="theme-color" content="#111827">

<title>SCAN OUTBOUND - H JOEL</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#eef1f4;
  font-family:Arial,sans-serif;
  color:#111827;
}

.app{
  max-width:520px;
  margin:auto;
  background:#fff;
  min-height:100vh;
}

.header{
  padding:20px 18px 18px;
  text-align:center;
  border-bottom:4px solid #ff7518;
}

.logo{
  width:100%;
  max-width:370px;
  height:auto;
  display:block;
  margin:0 auto 12px;
}

.title{
  font-size:28px;
  font-weight:900;
  margin-top:8px;
  letter-spacing:1px;
}

.subtitle{
  font-size:12px;
  color:#6b7280;
  margin-top:5px;
  letter-spacing:1px;
}

.content{
  padding:20px;
}

label{
  display:block;
  font-size:13px;
  font-weight:900;
  color:#4b5563;
  margin:17px 0 7px;
}

input,
select{
  width:100%;
  height:54px;
  border:1px solid #d1d5db;
  border-radius:13px;
  padding:0 14px;
  font-size:17px;
  background:#fff;
}

input:focus,
select:focus{
  outline:2px solid #ff7518;
  border-color:#ff7518;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:16px;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.scanBtn{
  margin-top:20px;
  background:#111827;
  color:white;
}

.stopBtn{
  margin-top:10px;
  background:#fff;
  border:1px solid #d1d5db;
}

.saveBtn{
  margin-top:15px;
  background:#ff7518;
  color:#fff;
}

.clearBtn{
  margin-top:10px;
  background:#fff1f2;
  color:#b91c1c;
}

.status{
  margin-top:15px;
  padding:14px;
  border-radius:12px;
  text-align:center;
  font-weight:800;
  border:1px solid #e5e7eb;
}

.ok{
  background:#ecfdf5;
  color:#065f46;
}

.error{
  background:#fef2f2;
  color:#991b1b;
}

.warn{
  background:#fff7ed;
  color:#9a3412;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.stat{
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:13px;
  padding:15px;
  text-align:center;
}

.number{
  font-size:31px;
  font-weight:900;
}

.statLabel{
  font-size:11px;
  color:#6b7280;
  margin-top:4px;
}

.list{
  margin-top:14px;
  max-height:300px;
  overflow:auto;
  border:1px solid #e5e7eb;
  border-radius:13px;
}

.row{
  display:flex;
  align-items:center;
  padding:11px;
  border-bottom:1px solid #eee;
}

.awb{
  flex:1;
  font-family:monospace;
  font-size:14px;
}

.row button{
  width:auto;
  padding:7px 10px;
  background:#fff1f2;
  color:#b91c1c;
}

.empty{
  padding:25px;
  text-align:center;
  color:#9ca3af;
}

.hidden{
  display:none!important;
}

#reader{
  margin-top:15px;
}

.photoPreview{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:13px;
  margin-top:10px;
  display:none;
}

</style>

</head>

<body>

<div class="app">

<div class="header">

  <img
    src="logo.png"
    alt="H JOEL LOGISTICS"
    class="logo"
  >

  <div class="title">
    SCAN OUTBOUND
  </div>

  <div class="subtitle">
    OUTBOUND SCANNING SYSTEM
  </div>

</div>

<div class="content">

<label>
TANGGAL PICK UP
</label>

<input
  type="date"
  id="tanggal"
>


<label>
NAMA DRIVER
</label>

<input
  type="text"
  id="driver"
  placeholder="Ketik nama driver"
>


<label>
PLAT NO
</label>

<input
  type="text"
  id="platNo"
  placeholder="Contoh: B 1234 XYZ"
  style="text-transform:uppercase"
>


<label>
VENDOR
</label>

<select id="vendor">

  <option value="">
    Memuat data vendor...
  </option>

</select>


<label>
FOTO DRIVER
</label>

<input
  type="file"
  id="fotoDriver"
  accept="image/*"
  capture="environment"
>

<img
  id="photoPreview"
  class="photoPreview"
>


<button
  id="startBtn"
  class="scanBtn"
  onclick="startScanner()"
>
📷 MULAI SCAN AWB
</button>


<button
  id="stopBtn"
  class="stopBtn hidden"
  onclick="stopScanner()"
>
■ HENTIKAN KAMERA
</button>


<div id="reader"></div>


<div
  id="status"
  class="status"
>
Menghubungkan ke sistem...
</div>


<div class="stats">

  <div class="stat">

    <div
      id="count"
      class="number"
    >
      0
    </div>

    <div class="statLabel">
      AWB TER-SCAN
    </div>

  </div>


  <div class="stat">

    <div
      id="duplicate"
      class="number"
    >
      0
    </div>

    <div class="statLabel">
      DUPLIKAT
    </div>

  </div>

</div>


<div
  id="awbList"
  class="list"
>

  <div class="empty">
    Belum ada AWB yang discan.
  </div>

</div>


<button
  id="saveBtn"
  class="saveBtn"
  onclick="saveAll()"
>
💾 SIMPAN SEMUA (0)
</button>


<button
  class="clearBtn"
  onclick="clearAll()"
>
HAPUS SEMUA AWB
</button>

</div>
</div>


<iframe
  name="saveFrame"
  class="hidden">
</iframe>


<form
  id="saveForm"
  method="POST"
  target="saveFrame"
  class="hidden"
>

<input
  id="formRequestId"
  name="requestId"
>

<input
  id="formPayload"
  name="payload"
>

</form>


<script>

/* ========================================
   BACKEND APPS SCRIPT
======================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbxJogfe_UYQD0ucBJb84tNixR97mv5dVVSt5tmjqDVYzfiH1HYPC4FqPZpTd_H6CTs7/exec';


let scanner=null;
let awbs=[];
let duplicateCount=0;
let lastCode='';
let lastTime=0;
let photoBase64='';


/* ========================================
   SAAT APLIKASI DIBUKA
======================================== */

window.addEventListener('load',function(){

  const now=new Date();

  const local=new Date(
    now.getTime()-
    now.getTimezoneOffset()*60000
  );

  document.getElementById('tanggal').value=
    local.toISOString().split('T')[0];

  document.getElementById('saveForm').action=
    API_URL;

  loadVendor();

});


/* ========================================
   JSONP
======================================== */

function jsonp(params){

  return new Promise(function(resolve,reject){

    const callback=
      'cb_'+Date.now()+
      Math.random().toString(36).slice(2);

    const script=
      document.createElement('script');

    window[callback]=function(data){

      delete window[callback];
      script.remove();
      resolve(data);

    };

    const url=new URL(API_URL);

    Object.entries(params).forEach(function(x){
      url.searchParams.set(x[0],x[1]);
    });

    url.searchParams.set('prefix',callback);

    script.src=url.toString();

    script.onerror=function(){

      delete window[callback];
      script.remove();

      reject(
        new Error('Koneksi backend gagal')
      );

    };

    document.head.appendChild(script);

  });

}


/* ========================================
   LOAD VENDOR
======================================== */

async function loadVendor(){

  const vendor=
    document.getElementById('vendor');

  try{

    const data=
      await jsonp({
        action:'master'
      });

    if(!data.success){
      throw new Error('Data Vendor gagal dibaca');
    }

    vendor.innerHTML=
      '<option value="">-- Pilih Vendor --</option>';

    (data.vendors||[]).forEach(function(v){

      const option=
        document.createElement('option');

      option.value=v;
      option.textContent=v;

      vendor.appendChild(option);

    });

    if((data.vendors||[]).length===0){

      setStatus(
        'Data Vendor pada sheet Validation kosong.',
        'warn'
      );

    }else{

      setStatus(
        'Siap digunakan.',
        'ok'
      );

    }

  }catch(err){

    vendor.innerHTML=
      '<option value="">Vendor gagal dimuat</option>';

    setStatus(
      'Gagal memuat Vendor: '+err.message,
      'error'
    );

  }

}


/* ========================================
   FOTO DRIVER
======================================== */

document
.getElementById('fotoDriver')
.addEventListener('change',async function(e){

  const file=e.target.files[0];

  if(!file)return;

  setStatus(
    'Memproses foto driver...',
    'warn'
  );

  photoBase64=
    await compressImage(file);

  const preview=
    document.getElementById('photoPreview');

  preview.src=photoBase64;
  preview.style.display='block';

  setStatus(
    'Foto Driver siap.',
    'ok'
  );

});


function compressImage(file){

  return new Promise(function(resolve,reject){

    const reader=
      new FileReader();

    reader.onerror=reject;

    reader.onload=function(event){

      const img=new Image();

      img.onload=function(){

        const maxWidth=1000;

        let width=img.width;
        let height=img.height;

        if(width>maxWidth){

          height=
            height*maxWidth/width;

          width=maxWidth;

        }

        const canvas=
          document.createElement('canvas');

        canvas.width=width;
        canvas.height=height;

        const ctx=
          canvas.getContext('2d');

        ctx.drawImage(
          img,
          0,0,
          width,height
        );

        resolve(
          canvas.toDataURL(
            'image/jpeg',
            0.65
          )
        );

      };

      img.onerror=reject;

      img.src=event.target.result;

    };

    reader.readAsDataURL(file);

  });

}


/* ========================================
   MULAI SCANNER
======================================== */

async function startScanner(){

  const driver=
    document.getElementById('driver').value.trim();

  const platNo=
    document.getElementById('platNo').value.trim();

  const vendor=
    document.getElementById('vendor').value;


  if(!driver){

    return setStatus(
      'Nama Driver wajib diisi.',
      'error'
    );

  }

  if(!platNo){

    return setStatus(
      'Plat No wajib diisi.',
      'error'
    );

  }

  if(!vendor){

    return setStatus(
      'Vendor wajib dipilih.',
      'error'
    );

  }

  if(!photoBase64){

    return setStatus(
      'Foto Driver wajib diambil terlebih dahulu.',
      'error'
    );

  }


  try{

    scanner=
      new Html5Qrcode('reader');

    const cameras=
      await Html5Qrcode.getCameras();

    if(!cameras.length){
      throw new Error('Kamera tidak ditemukan');
    }

    let cameraId=
      cameras[cameras.length-1].id;

    const rear=
      cameras.find(function(c){

        return /back|rear|environment/i
          .test(c.label||'');

      });

    if(rear){
      cameraId=rear.id;
    }


    await scanner.start(

      cameraId,

      {
        fps:12,
        qrbox:function(w,h){

          return{
            width:Math.floor(w*0.9),
            height:140
          };

        }
      },

      onScan,

      function(){}

    );


    document
      .getElementById('startBtn')
      .classList.add('hidden');

    document
      .getElementById('stopBtn')
      .classList.remove('hidden');

    setStatus(
      'Scanner aktif. Silakan scan AWB berulang kali.',
      'ok'
    );

  }catch(err){

    scanner=null;

    setStatus(
      'Kamera gagal: '+(err.message||err),
      'error'
    );

  }

}


/* ========================================
   STOP SCANNER
======================================== */

async function stopScanner(){

  if(scanner){

    try{
      await scanner.stop();
      await scanner.clear();
    }catch(e){}

  }

  scanner=null;

  document
    .getElementById('startBtn')
    .classList.remove('hidden');

  document
    .getElementById('stopBtn')
    .classList.add('hidden');

}


/* ========================================
   HASIL SCAN
======================================== */

function onScan(text){

  const awb=
    String(text||'')
    .trim()
    .replace(/\s+/g,'');

  if(!awb)return;


  const now=Date.now();


  if(
    awb===lastCode &&
    now-lastTime<1800
  ){
    return;
  }


  lastCode=awb;
  lastTime=now;


  if(awbs.includes(awb)){

    duplicateCount++;

    document
      .getElementById('duplicate')
      .textContent=duplicateCount;

    setStatus(
      'AWB DUPLIKAT: '+awb,
      'warn'
    );

    if(navigator.vibrate){
      navigator.vibrate([100,50,100]);
    }

    return;

  }


  awbs.push(awb);

  render();

  setStatus(
    '✓ AWB '+awb+' berhasil ditambahkan.',
    'ok'
  );

  if(navigator.vibrate){
    navigator.vibrate(60);
  }

}


/* ========================================
   DAFTAR AWB
======================================== */

function render(){

  const count=
    document.getElementById('count');

  const saveBtn=
    document.getElementById('saveBtn');

  const list=
    document.getElementById('awbList');


  count.textContent=
    awbs.length;

  saveBtn.textContent=
    '💾 SIMPAN SEMUA ('+
    awbs.length+
    ')';


  list.innerHTML='';


  if(awbs.length===0){

    list.innerHTML=
      '<div class="empty">'+
      'Belum ada AWB yang discan.'+
      '</div>';

    return;

  }


  awbs
  .slice()
  .reverse()
  .forEach(function(awb,ri){

    const index=
      awbs.length-1-ri;

    const row=
      document.createElement('div');

    row.className='row';


    const text=
      document.createElement('div');

    text.className='awb';

    text.textContent=
      '✓ '+awb;


    const btn=
      document.createElement('button');

    btn.textContent='Hapus';

    btn.onclick=function(){

      awbs.splice(index,1);

      render();

    };


    row.append(text,btn);

    list.appendChild(row);

  });

}


/* ========================================
   HAPUS SEMUA
======================================== */

function clearAll(){

  if(awbs.length===0)return;

  if(
    !confirm(
      'Hapus semua AWB yang sudah discan?'
    )
  ){
    return;
  }

  awbs=[];
  duplicateCount=0;

  document
    .getElementById('duplicate')
    .textContent='0';

  render();

  setStatus(
    'Daftar AWB dikosongkan.',
    'warn'
  );

}


/* ========================================
   SIMPAN SEMUA
======================================== */

async function saveAll(){

  const tanggal=
    document.getElementById('tanggal').value;

  const driver=
    document.getElementById('driver').value.trim();

  const platNo=
    document.getElementById('platNo').value
      .trim()
      .toUpperCase();

  const vendor=
    document.getElementById('vendor').value;


  if(!tanggal)
    return setStatus(
      'Tanggal Pick Up wajib diisi.',
      'error'
    );

  if(!driver)
    return setStatus(
      'Nama Driver wajib diisi.',
      'error'
    );

  if(!platNo)
    return setStatus(
      'Plat No wajib diisi.',
      'error'
    );

  if(!vendor)
    return setStatus(
      'Vendor wajib dipilih.',
      'error'
    );

  if(!photoBase64)
    return setStatus(
      'Foto Driver wajib diambil.',
      'error'
    );

  if(awbs.length===0)
    return setStatus(
      'Belum ada AWB yang discan.',
      'warn'
    );


  const saveBtn=
    document.getElementById('saveBtn');

  const requestId=
    'REQ_'+Date.now();


  document
    .getElementById('formRequestId')
    .value=requestId;


  document
    .getElementById('formPayload')
    .value=
      JSON.stringify({

        tanggal:tanggal,

        driver:driver,

        platNo:platNo,

        vendor:vendor,

        fotoDriver:photoBase64,

        awbs:awbs

      });


  saveBtn.disabled=true;

  saveBtn.textContent=
    '⏳ MENYIMPAN...';

  setStatus(
    'Sedang menyimpan '+awbs.length+' AWB...',
    'warn'
  );


  document
    .getElementById('saveForm')
    .submit();


  try{

    let result=null;


    for(let i=0;i<35;i++){

      await new Promise(function(r){
        setTimeout(r,700);
      });


      const data=
        await jsonp({

          action:'result',

          requestId:requestId

        });


      if(!data.pending){

        result=data;

        break;

      }

    }


    if(!result){

      throw new Error(
        'Server tidak memberikan respons.'
      );

    }


    if(result.success){

      const saved=result.saved||0;

      const duplicates=
        result.duplicateCount||0;


      setStatus(
        '✓ BERHASIL: '+
        saved+
        ' AWB tersimpan'+
        (
          duplicates
          ? ' • '+duplicates+
            ' AWB sudah pernah ada'
          : ''
        ),
        'ok'
      );


      awbs=[];
      duplicateCount=0;

      document
        .getElementById('duplicate')
        .textContent='0';

      render();


    }else{

      setStatus(
        result.message||
        'Gagal menyimpan data.',
        result.duplicateOnly
          ? 'warn'
          : 'error'
      );

    }


  }catch(err){

    setStatus(
      'Gagal menyimpan: '+
      err.message,
      'error'
    );

  }


  saveBtn.disabled=false;

  render();

}


/* ========================================
   STATUS
======================================== */

function setStatus(text,type){

  const el=
    document.getElementById('status');

  el.className=
    'status '+(type||'');

  el.textContent=text;

}

</script>

</body>
</html>
