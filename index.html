<div class="title">SCAN OUTBOUND</div>

<div class="body">
<label>TANGGAL PICK UP</label><input type="date" id="tanggal">
<label>NAMA DRIVER</label><select id="driver"><option value="">Memuat data driver...</option></select>
<label>AGENT</label><select id="agent"><option value="">Memuat data agent...</option></select>

<button id="startBtn" class="primary" onclick="startScanner()">📷 MULAI SCAN</button>
<button id="stopBtn" class="secondary hidden" onclick="stopScanner()">■ HENTIKAN KAMERA</button>
<div id="reader"></div>
<div id="status" class="status">Memuat master data...</div>

<div class="stats">
<div class="stat"><div class="num" id="count">0</div><div class="lbl">AWB TER-SCAN</div></div>
<div class="stat"><div class="num" id="dup">0</div><div class="lbl">DUPLIKAT</div></div>
</div>

<div id="list" class="list"><div class="empty">Belum ada AWB.</div></div>
<button id="saveBtn" class="orange" onclick="saveAll()">💾 SIMPAN SEMUA (0)</button>
<button class="danger" onclick="clearAll()">HAPUS SEMUA</button>
<div class="note">Scan berkali-kali, lalu tekan SIMPAN SEMUA. Driver diambil dari Data MP dan Agent dari Validation.</div>
</div>
</div>

<iframe name="saveFrame" id="saveFrame" class="hidden"></iframe>
<form id="saveForm" method="POST" target="saveFrame" action="https://script.google.com/macros/s/AKfycbxJogfe_UYQD0ucBJb84tNixR97mv5dVVSt5tmjqDVYzfiH1HYPC4FqPZpTd_H6CTs7/exec" class="hidden">
<input name="requestId" id="formRequestId">
<input name="payload" id="formPayload">
</form>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxJogfe_UYQD0ucBJb84tNixR97mv5dVVSt5tmjqDVYzfiH1HYPC4FqPZpTd_H6CTs7/exec";
let scanner=null, awbs=[], dup=0, lastCode='', lastTime=0;

window.addEventListener('load', async()=>{
  const now=new Date();
  const local=new Date(now.getTime()-now.getTimezoneOffset()*60000);
  document.getElementById('tanggal').value=local.toISOString().split('T')[0];
  await loadMaster();
});

function jsonp(params, timeout=12000){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();reject(new Error('Timeout'));},timeout);
    function cleanup(){clearTimeout(timer);delete window[cb];script.remove();}
    window[cb]=(data)=>{cleanup();resolve(data);};
    const url=new URL(API_URL);
    Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
    url.searchParams.set('prefix',cb);
    url.searchParams.set('_',Date.now());
    script.src=url.toString();
    script.onerror=()=>{cleanup();reject(new Error('Koneksi backend gagal'));};
    document.head.appendChild(script);
  });
}

async function loadMaster(){
  try{
    const d=await jsonp({action:'master'});
    if(!d.success) throw new Error(d.message||'Gagal');
    fill('driver',d.drivers,'-- Pilih Nama Driver --');
    fill('agent',d.agents,'-- Pilih Agent --');
    setStatus('Siap digunakan. Pilih Driver dan Agent.','ok');
  }catch(e){ setStatus('Gagal memuat Driver/Agent: '+e.message,'err'); }
}
function fill(id,items,ph){
  const el=document.getElementById(id); el.innerHTML='';
  let o=document.createElement('option'); o.value=''; o.textContent=ph; el.appendChild(o);
  (items||[]).forEach(x=>{let a=document.createElement('option');a.value=x;a.textContent=x;el.appendChild(a);});
}

async function startScanner(){
  if(!document.getElementById('tanggal').value) return setStatus('Pilih tanggal.','err');
  if(!document.getElementById('driver').value) return setStatus('Pilih Nama Driver.','err');
  if(!document.getElementById('agent').value) return setStatus('Pilih Agent.','err');
  try{
    scanner=new Html5Qrcode('reader');
    const cams=await Html5Qrcode.getCameras();
    if(!cams.length) throw new Error('Kamera tidak ditemukan');
    let id=cams[cams.length-1].id;
    const back=cams.find(c=>/back|rear|environment/i.test(c.label||'')); if(back) id=back.id;
    await scanner.start(id,{fps:12,qrbox:(w,h)=>({width:Math.floor(w*.9),height:Math.min(150,Math.floor(h*.4))}),aspectRatio:1.7},onScan,()=>{});
    document.getElementById('startBtn').classList.add('hidden');
    document.getElementById('stopBtn').classList.remove('hidden');
    setStatus('Kamera aktif. Arahkan ke barcode AWB.','ok');
  }catch(e){scanner=null;setStatus('Kamera gagal: '+(e.message||e),'err');}
}
async function stopScanner(){
  if(!scanner)return;
  try{await scanner.stop();await scanner.clear();}catch(e){}
  scanner=null;
  document.getElementById('startBtn').classList.remove('hidden');
  document.getElementById('stopBtn').classList.add('hidden');
  setStatus('Kamera dihentikan.','');
}
function onScan(txt){
  const awb=String(txt||'').trim().replace(/\s+/g,''); if(!awb)return;
  const now=Date.now(); if(awb===lastCode && now-lastTime<1800)return; lastCode=awb;lastTime=now;
  if(awbs.includes(awb)){dup++;document.getElementById('dup').textContent=dup;setStatus('DUPLIKAT: '+awb,'warn');vibe([70,50,70]);beep(300);return;}
  awbs.push(awb);render();setStatus('✓ SCAN: '+awb,'ok');vibe(70);beep(900);
}
function render(){
  document.getElementById('count').textContent=awbs.length;
  document.getElementById('saveBtn').textContent='💾 SIMPAN SEMUA ('+awbs.length+')';
  const box=document.getElementById('list');box.innerHTML='';
  if(!awbs.length){box.innerHTML='<div class="empty">Belum ada AWB.</div>';return;}
  awbs.slice().reverse().forEach((awb,ri)=>{
    const i=awbs.length-1-ri; const row=document.createElement('div');row.className='row';
    const t=document.createElement('div');t.className='awb';t.textContent='✓ '+awb;
    const b=document.createElement('button');b.className='del';b.textContent='Hapus';b.onclick=()=>{awbs.splice(i,1);render();};
    row.append(t,b);box.appendChild(row);
  });
}
function clearAll(){if(!awbs.length)return;if(confirm('Hapus semua AWB?')){awbs=[];dup=0;document.getElementById('dup').textContent='0';render();setStatus('Daftar dikosongkan.','');}}
async function saveAll(){
  const tanggal=document.getElementById('tanggal').value,driver=document.getElementById('driver').value,agent=document.getElementById('agent').value;
  if(!tanggal||!driver||!agent)return setStatus('Tanggal, Driver, Agent wajib dipilih.','err');
  if(!awbs.length)return setStatus('Belum ada AWB.','warn');
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='MENYIMPAN...';
  const requestId='req_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  document.getElementById('formRequestId').value=requestId;
  document.getElementById('formPayload').value=JSON.stringify({tanggal,driver,agent,awbs});
  document.getElementById('saveForm').submit();
  try{
    let d=null;
    for(let i=0;i<20;i++){
      await new Promise(r=>setTimeout(r,500));
      const x=await jsonp({action:'result',requestId},5000);
      if(!x.pending){d=x;break;}
    }
    if(!d)throw new Error('Tidak ada respons penyimpanan.');
    if(d.success){
      setStatus('✓ '+d.saved+' AWB BERHASIL DISIMPAN'+(d.duplicateCount?' • '+d.duplicateCount+' DUPLIKAT':''),d.duplicateCount?'warn':'ok');
      awbs=[];dup=0;document.getElementById('dup').textContent='0';render();vibe([100,50,100]);beep(1000);
    }else setStatus(d.message||'Gagal menyimpan.',d.duplicateOnly?'warn':'err');
  }catch(e){setStatus('Gagal menyimpan: '+e.message,'err');}
  btn.disabled=false;render();
}
function setStatus(m,t){const s=document.getElementById('status');s.className='status'+(t?' '+t:'');s.textContent=m;}
function vibe(p){if(navigator.vibrate)navigator.vibrate(p)}
function beep(f){try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.08;o.start();o.stop(c.currentTime+.09);}catch(e){}}
</script>
</body>
