<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<meta name="theme-color" content="#ff6a00">

<title>SCAN OUTBOUND - H JOEL LOGISTICS</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f1f2f4;
  font-family: Arial, sans-serif;
  color: #20252b;
}

.app {
  max-width: 520px;
  min-height: 100vh;
  margin: auto;
  background: white;
}

.header {
  text-align: center;
  background: white;
  padding: 14px 18px 12px;
  border-bottom: 4px solid #ff6a00;
}

.logo {
  width: 100%;
  max-width: 350px;
}

.title {
  margin-top: 10px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 1px;
}

.subtitle {
  margin-top: 4px;
  color: #777;
  font-size: 12px;
}

.content {
  padding: 18px;
}

.section-title {
  margin: 5px 0 13px;
  font-size: 15px;
  font-weight: 900;
}

.field {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  min-height: 49px;
  border-radius: 9px;
  font-size: 16px;
}

input,
select {
  border: 1px solid #ccc;
  padding: 11px;
  background: white;
}

button {
  border: 0;
  padding: 12px;
  font-weight: 800;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.btn-dark {
  background: #20252b;
  color: white;
}

.btn-orange {
  background: #ff6a00;
  color: white;
}

.btn-red {
  background: #d9342b;
  color: white;
}

.btn-green {
  background: #148c47;
  color: white;
}

.divider {
  height: 1px;
  background: #e8e8e8;
  margin: 22px 0;
}


/* FOTO CAMERA */

#photoCameraBox {
  display: none;
  margin-top: 10px;
}

#photoVideo {
  width: 100%;
  max-height: 380px;
  background: #111;
  border-radius: 12px;
  object-fit: cover;
}

.photo-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

#photoPreviewBox {
  display: none;
  margin-top: 12px;
  padding: 7px;
  background: #f3f3f3;
  border-radius: 10px;
}

#photoPreview {
  width: 100%;
  max-height: 350px;
  object-fit: contain;
  border-radius: 8px;
}


/* SCANNER */

#reader {
  width: 100%;
  margin-top: 10px;
  overflow: hidden;
  border-radius: 12px;
}

.scan-buttons {
  display: grid;
  gap: 8px;
}

.counter-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 15px 0 9px;
}

.counter {
  background: #20252b;
  color: white;
  padding: 8px 13px;
  border-radius: 18px;
  font-size: 13px;
  font-weight: bold;
}

.clear {
  width: auto;
  min-height: 35px;
  background: #eee;
  padding: 6px 10px;
  font-size: 12px;
}

.awb-list {
  max-height: 280px;
  overflow-y: auto;
  background: #f5f6f7;
  padding: 9px;
  border-radius: 10px;
}

.empty {
  text-align: center;
  padding: 18px;
  color: #888;
  font-size: 13px;
}

.awb-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: white;
  border: 1px solid #ddd;
  padding: 10px;
  margin-bottom: 6px;
  border-radius: 8px;
}

.awb-number {
  flex: 1;
  font-weight: bold;
  font-size: 14px;
  word-break: break-all;
}

.delete {
  width: auto;
  min-height: 32px;
  background: #d9342b;
  color: white;
  font-size: 11px;
  padding: 5px 8px;
}


/* STATUS */

.status {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 9px;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
}

.success {
  display: block;
  background: #e1f5e9;
  color: #14723b;
}

.error {
  display: block;
  background: #fde5e3;
  color: #b1261c;
}

.info {
  display: block;
  background: #fff0df;
  color: #975300;
}

.footer {
  padding: 20px;
  text-align: center;
  font-size: 11px;
  color: #aaa;
}

</style>

</head>


<body>


<div class="app">


<div class="header">

<img
  src="H_JOEL_LOGISTICS_logo.png"
  class="logo"
  alt="H JOEL LOGISTICS"
>

<div class="title">
SCAN OUTBOUND
</div>

<div class="subtitle">
H JOEL LOGISTICS
</div>

</div>


<div class="content">


<div class="section-title">
INFORMASI PICK UP
</div>


<div class="field">

<label>
Tanggal Pick Up
</label>

<input
  type="date"
  id="tanggalPickup"
>

</div>


<div class="field">

<label>
Nama Driver
</label>

<input
  type="text"
  id="namaDriver"
  placeholder="Masukkan nama driver"
  autocomplete="off"
>

</div>


<div class="field">

<label>
Plat No
</label>

<input
  type="text"
  id="platNo"
  placeholder="Contoh: F 1234 ABC"
  autocomplete="off"
  oninput="this.value=this.value.toUpperCase()"
>

</div>


<div class="field">

<label>
Vendor
</label>

<select id="vendor">

<option value="">
Memuat Vendor...
</option>

</select>

</div>



<div class="divider"></div>



<div class="section-title">
FOTO DRIVER
</div>


<button
  type="button"
  class="btn-orange"
  id="btnOpenPhoto"
  onclick="openPhotoCamera()"
>
📷 BUKA KAMERA DRIVER
</button>


<div id="photoCameraBox">

<video
  id="photoVideo"
  autoplay
  playsinline
></video>


<div class="photo-actions">

<button
  type="button"
  class="btn-green"
  onclick="captureDriverPhoto()"
>
📸 AMBIL FOTO
</button>

<button
  type="button"
  class="btn-red"
  onclick="closePhotoCamera()"
>
TUTUP
</button>

</div>

</div>


<div id="photoPreviewBox">

<img
  id="photoPreview"
  alt="Foto Driver"
>

<button
  type="button"
  class="btn-orange"
  style="margin-top:8px;"
  onclick="openPhotoCamera()"
>
🔄 FOTO ULANG
</button>

</div>



<div class="divider"></div>



<div class="section-title">
SCAN AWB
</div>


<div class="scan-buttons">

<button
  type="button"
  class="btn-dark"
  id="btnStartScanner"
  onclick="startScanner()"
>
📷 MULAI SCAN AWB
</button>


<button
  type="button"
  class="btn-red"
  id="btnStopScanner"
  onclick="stopScanner()"
  style="display:none;"
>
⛔ STOP SCANNER
</button>

</div>


<div id="reader"></div>


<div class="counter-row">

<div
  class="counter"
  id="awbCounter"
>
0 AWB
</div>

<button
  class="clear"
  onclick="clearAwbs()"
>
Hapus Semua
</button>

</div>


<div
  class="awb-list"
  id="awbList"
>

<div class="empty">
Belum ada AWB yang discan.
</div>

</div>



<div class="divider"></div>


<button
  type="button"
  class="btn-green"
  id="btnSave"
  onclick="saveData()"
>
💾 SIMPAN SEMUA DATA
</button>


<div
  id="status"
  class="status"
></div>


</div>


<div class="footer">
H JOEL LOGISTICS • SCAN OUTBOUND
</div>


</div>



<script>


const API_URL =
'https://script.google.com/macros/s/AKfycbwvSTmZkm9CGrEW3kJG8Du_THFSNX0fE49y97wElfXzANkfewhp-LuMtyPqZD8P4DWwCg/exec';


let scanner = null;

let scannedAwbs = [];

let scanLock = false;

let photoStream = null;

let photoBase64 = '';

let audioContext = null;



/* ==================================================
START
================================================== */

document.addEventListener(
'DOMContentLoaded',
function() {

  setToday();

  loadVendors();

}
);



function setToday() {

const now = new Date();

const y =
now.getFullYear();

const m =
String(
now.getMonth() + 1
).padStart(2,'0');

const d =
String(
now.getDate()
).padStart(2,'0');

document.getElementById(
'tanggalPickup'
).value =
y + '-' + m + '-' + d;

}



/* ==================================================
VENDOR - JSONP
================================================== */

function loadVendors() {

const callbackName =
'hjoelVendorCallback_' +
Date.now();


window[callbackName] =
function(result) {

  const select =
  document.getElementById(
    'vendor'
  );

  select.innerHTML =
  '<option value="">-- Pilih Vendor --</option>';


  if (
    result &&
    result.success &&
    Array.isArray(
      result.vendors
    )
  ) {

    result.vendors.forEach(
    function(vendor) {

      const opt =
      document.createElement(
        'option'
      );

      opt.value = vendor;

      opt.textContent = vendor;

      select.appendChild(opt);

    });

  } else {

    showStatus(
      result?.message ||
      'Vendor gagal dimuat.',
      'error'
    );

  }


  delete window[
    callbackName
  ];

  script.remove();

};


const script =
document.createElement(
'script'
);


script.onerror =
function() {

showStatus(
  'Vendor gagal dimuat dari Google Sheet.',
  'error'
);

};


script.src =
API_URL +
'?action=getVendors' +
'&callback=' +
callbackName +
'&t=' +
Date.now();


document.body.appendChild(
script
);

}



/* ==================================================
KAMERA FOTO DRIVER
================================================== */

async function openPhotoCamera() {

clearStatus();

stopScanner();


try {

  if (photoStream) {

    photoStream
    .getTracks()
    .forEach(
      track =>
      track.stop()
    );

  }


  photoStream =
  await navigator.mediaDevices
  .getUserMedia({

    video: {

      facingMode: {
        ideal:
        'environment'
      }

    },

    audio: false

  });


  const video =
  document.getElementById(
    'photoVideo'
  );


  video.srcObject =
  photoStream;


  document.getElementById(
    'photoCameraBox'
  ).style.display =
  'block';


  document.getElementById(
    'btnOpenPhoto'
  ).style.display =
  'none';


} catch(error) {

  console.error(error);

  showStatus(
    'Kamera tidak dapat dibuka. Izinkan kamera pada browser.',
    'error'
  );

}

}



function captureDriverPhoto() {

const video =
document.getElementById(
'photoVideo'
);


if (
!video.videoWidth
) {

showStatus(
  'Kamera belum siap.',
  'error'
);

return;

}


const canvas =
document.createElement(
'canvas'
);


let width =
video.videoWidth;

let height =
video.videoHeight;


const maxWidth =
1280;


if (
width > maxWidth
) {

height =
Math.round(
height *
maxWidth /
width
);

width =
maxWidth;

}


canvas.width =
width;

canvas.height =
height;


const ctx =
canvas.getContext(
'2d'
);


ctx.drawImage(
video,
0,
0,
width,
height
);


photoBase64 =
canvas.toDataURL(
'image/jpeg',
0.72
);


document.getElementById(
'photoPreview'
).src =
photoBase64;


document.getElementById(
'photoPreviewBox'
).style.display =
'block';


closePhotoCamera();


showStatus(
'✅ Foto Driver berhasil diambil.',
'success'
);

}



function closePhotoCamera() {

if (photoStream) {

photoStream
.getTracks()
.forEach(
track =>
track.stop()
);

photoStream =
null;

}


document.getElementById(
'photoCameraBox'
).style.display =
'none';


document.getElementById(
'btnOpenPhoto'
).style.display =
'block';

}



/* ==================================================
SCANNER AWB
================================================== */

async function startScanner() {

clearStatus();


/*
Membuat AudioContext melalui klik pengguna,
supaya beep tidak diblokir Chrome.
*/

try {

if (!audioContext) {

audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}

if (
audioContext.state ===
'suspended'
) {

await audioContext.resume();

}

} catch(error) {

console.log(error);

}


closePhotoCamera();


if (scanner) {
return;
}


try {

const cameras =
await Html5Qrcode.getCameras();


if (
!cameras ||
cameras.length === 0
) {

throw new Error(
'Kamera tidak ditemukan.'
);

}


let cameraId =
cameras[
cameras.length - 1
].id;


const rear =
cameras.find(
camera =>
/back|rear|environment/i
.test(camera.label)
);


if (rear) {

cameraId =
rear.id;

}


scanner =
new Html5Qrcode(
'reader'
);


await scanner.start(

cameraId,

{

fps: 12,

qrbox:
function(
width,
height
) {

let boxWidth =
Math.floor(
width * .90
);

if (
boxWidth > 380
) {

boxWidth = 380;

}


return {

width:
boxWidth,

height:
140

};

}

},

onScanSuccess,

function() {}

);


document.getElementById(
'btnStartScanner'
).style.display =
'none';


document.getElementById(
'btnStopScanner'
).style.display =
'block';


showStatus(
'Scanner aktif. Arahkan barcode AWB ke kamera.',
'info'
);


} catch(error) {

console.error(error);

scanner = null;


showStatus(
'Kamera scanner gagal dibuka. Pastikan izin kamera aktif.',
'error'
);

}

}



function onScanSuccess(
decodedText
) {

if (
scanLock
) {
return;
}


const awb =
String(
decodedText || ''
).trim();


if (!awb) {
return;
}


scanLock =
true;


if (
scannedAwbs.includes(
awb
)
) {

duplicateSound();

vibrateDuplicate();


showStatus(
'AWB sudah discan: ' +
awb,
'error'
);


} else {

scannedAwbs.push(
awb
);


renderAwbs();


scanSound();


if (
navigator.vibrate
) {

navigator.vibrate(
130
);

}


showStatus(
'✅ SCAN BERHASIL: ' +
awb,
'success'
);

}


setTimeout(
function() {

scanLock =
false;

},
1000
);

}



/* ==================================================
SUARA SCAN
================================================== */

function scanSound() {

try {

if (!audioContext) {

audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}


const oscillator =
audioContext
.createOscillator();


const gain =
audioContext
.createGain();


oscillator
.connect(gain);


gain.connect(
audioContext.destination
);


oscillator.type =
'sine';


oscillator.frequency
.setValueAtTime(
1050,
audioContext.currentTime
);


gain.gain
.setValueAtTime(
0.25,
audioContext.currentTime
);


gain.gain
.exponentialRampToValueAtTime(
0.01,
audioContext.currentTime + .14
);


oscillator.start(
audioContext.currentTime
);


oscillator.stop(
audioContext.currentTime +
.15
);


} catch(error) {

console.log(error);

}

}



function duplicateSound() {

try {

if (!audioContext) {
return;
}


const oscillator =
audioContext
.createOscillator();


const gain =
audioContext
.createGain();


oscillator.connect(
gain
);

gain.connect(
audioContext.destination
);


oscillator.frequency.value =
350;


gain.gain.value =
.18;


oscillator.start();


oscillator.stop(
audioContext.currentTime +
.20
);


} catch(error) {}

}



function vibrateDuplicate() {

if (
navigator.vibrate
) {

navigator.vibrate([
100,
70,
100
]);

}

}



async function stopScanner() {

if (!scanner) {
return;
}


try {

await scanner.stop();

scanner.clear();

} catch(error) {

console.log(error);

}


scanner =
null;


document.getElementById(
'btnStartScanner'
).style.display =
'block';


document.getElementById(
'btnStopScanner'
).style.display =
'none';

}



/* ==================================================
DAFTAR AWB
================================================== */

function renderAwbs() {

const list =
document.getElementById(
'awbList'
);


const counter =
document.getElementById(
'awbCounter'
);


counter.textContent =
scannedAwbs.length +
' AWB';


if (
scannedAwbs.length === 0
) {

list.innerHTML =
'<div class="empty">Belum ada AWB yang discan.</div>';

return;

}


list.innerHTML =
'';


scannedAwbs.forEach(
function(
awb,
index
) {

const row =
document.createElement(
'div'
);


row.className =
'awb-item';


const text =
document.createElement(
'div'
);


text.className =
'awb-number';


text.textContent =
(index + 1) +
'. ' +
awb;


const del =
document.createElement(
'button'
);


del.type =
'button';


del.className =
'delete';


del.textContent =
'Hapus';


del.onclick =
function() {

scannedAwbs.splice(
index,
1
);

renderAwbs();

};


row.appendChild(
text
);

row.appendChild(
del
);

list.appendChild(
row
);

});

}



function clearAwbs() {

if (
scannedAwbs.length === 0
) {
return;
}


if (
!confirm(
'Hapus semua AWB?'
)
) {
return;
}


scannedAwbs =
[];


renderAwbs();

}



/* ==================================================
SIMPAN
================================================== */

async function saveData() {

clearStatus();


const tanggal =
document.getElementById(
'tanggalPickup'
).value;


const driver =
document.getElementById(
'namaDriver'
).value.trim();


const plat =
document.getElementById(
'platNo'
).value.trim();


const vendor =
document.getElementById(
'vendor'
).value;


if (!tanggal) {

showStatus(
'Tanggal Pick Up wajib diisi.',
'error'
);

return;

}


if (!driver) {

showStatus(
'Nama Driver wajib diisi.',
'error'
);

return;

}


if (!plat) {

showStatus(
'Plat No wajib diisi.',
'error'
);

return;

}


if (!vendor) {

showStatus(
'Vendor wajib dipilih.',
'error'
);

return;

}


if (
!photoBase64
) {

showStatus(
'Foto Driver wajib diambil.',
'error'
);

return;

}


if (
scannedAwbs.length === 0
) {

showStatus(
'Belum ada AWB yang discan.',
'error'
);

return;

}


const btn =
document.getElementById(
'btnSave'
);


btn.disabled =
true;


btn.textContent =
'⏳ MENYIMPAN...';


try {

await stopScanner();


const payload = {

action:
'save',

tanggalPickup:
tanggal,

namaDriver:
driver,

platNo:
plat,

vendor:
vendor,

awbs:
scannedAwbs,

fotoDriver:
photoBase64

};


const response =
await fetch(

API_URL,

{

method:
'POST',

headers: {

'Content-Type':
'text/plain;charset=utf-8'

},

body:
JSON.stringify(
payload
)

}

);


const text =
await response.text();


const result =
JSON.parse(text);


if (
!result.success
) {

throw new Error(
result.message ||
'Gagal menyimpan.'
);

}


showStatus(
'✅ ' +
result.jumlah +
' AWB BERHASIL DISIMPAN',
'success'
);


scannedAwbs =
[];


renderAwbs();


photoBase64 =
'';


document.getElementById(
'photoPreviewBox'
).style.display =
'none';


} catch(error) {

console.error(error);


showStatus(
'❌ Gagal menyimpan: ' +
error.message,
'error'
);

}


btn.disabled =
false;


btn.textContent =
'💾 SIMPAN SEMUA DATA';

}



/* ==================================================
STATUS
================================================== */

function showStatus(
message,
type
) {

const status =
document.getElementById(
'status'
);


status.className =
'status ' +
type;


status.textContent =
message;

}



function clearStatus() {

const status =
document.getElementById(
'status'
);


status.className =
'status';


status.textContent =
'';

}



</script>

</body>
</html>
