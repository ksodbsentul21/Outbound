<script>


// ==================================================
// BACKEND
// ==================================================

const API_URL =
'https://script.google.com/macros/s/AKfycbxJogfe_UYQD0ucBJb84tNixR97mv5dVVSt5tmjqDVYzfiH1HYPC4FqPZpTd_H6CTs7/exec';


let scanner = null;

let awbs = [];

let duplicateCount = 0;

let lastCode = '';

let lastTime = 0;


// FOTO DRIVER

let photoStream = null;

let photoBase64 = '';


// ==================================================
// LOAD
// ==================================================

window.addEventListener(
  'load',
  function(){

    const now =
      new Date();


    const local =
      new Date(
        now.getTime() -
        now.getTimezoneOffset() *
        60000
      );


    document
      .getElementById(
        'tanggal'
      )
      .value =
      local
        .toISOString()
        .split('T')[0];


    document
      .getElementById(
        'saveForm'
      )
      .action =
      API_URL;


    loadVendor();

  }
);


// ==================================================
// JSONP
// ==================================================

function jsonp(params){

  return new Promise(
    function(resolve,reject){

      const callback =
        'cb_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const script =
        document.createElement(
          'script'
        );


      const timeout =
        setTimeout(
          function(){

            cleanup();

            reject(
              new Error(
                'Koneksi backend timeout'
              )
            );

          },
          15000
        );


      function cleanup(){

        clearTimeout(timeout);

        delete window[
          callback
        ];

        script.remove();

      }


      window[
        callback
      ] =
        function(data){

          cleanup();

          resolve(data);

        };


      const url =
        new URL(
          API_URL
        );


      Object
        .entries(
          params || {}
        )
        .forEach(
          function(entry){

            url
              .searchParams
              .set(
                entry[0],
                entry[1]
              );

          }
        );


      url
        .searchParams
        .set(
          'prefix',
          callback
        );


      url
        .searchParams
        .set(
          '_',
          Date.now()
        );


      script.src =
        url.toString();


      script.onerror =
        function(){

          cleanup();

          reject(
            new Error(
              'Koneksi backend gagal'
            )
          );

        };


      document
        .head
        .appendChild(
          script
        );

    }
  );

}


// ==================================================
// VENDOR
// ==================================================

async function loadVendor(){

  const vendorSelect =
    document.getElementById(
      'vendor'
    );


  try{

    const data =
      await jsonp({
        action:
          'master'
      });


    if(
      !data ||
      !data.success
    ){

      throw new Error(
        'Data Vendor gagal dibaca'
      );

    }


    vendorSelect.innerHTML =
      '<option value="">-- Pilih Vendor --</option>';


    (data.vendors || [])
      .forEach(
        function(v){

          const option =
            document.createElement(
              'option'
            );


          option.value =
            v;

          option.textContent =
            v;


          vendorSelect
            .appendChild(
              option
            );

        }
      );


    if(
      (data.vendors || [])
        .length === 0
    ){

      setStatus(
        'Data Vendor di Validation kosong.',
        'warn'
      );

    }else{

      setStatus(
        '✓ Sistem siap digunakan.',
        'ok'
      );

    }


  }catch(err){

    vendorSelect.innerHTML =
      '<option value="">Vendor gagal dimuat</option>';


    setStatus(
      'Gagal memuat Vendor: ' +
      err.message,
      'error'
    );

  }

}


// ==================================================
// FOTO DRIVER - BUKA KAMERA
// ==================================================

async function openPhotoCamera(){

  // scanner AWB harus berhenti dulu
  if(scanner){

    await stopScanner();

  }


  closePhotoCamera();


  try{

    photoStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:'environment'
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        });


    const video =
      document.getElementById(
        'photoVideo'
      );


    video.srcObject =
      photoStream;


    document
      .getElementById(
        'photoCameraArea'
      )
      .classList
      .remove(
        'hidden'
      );


    document
      .getElementById(
        'openPhotoBtn'
      )
      .classList
      .add(
        'hidden'
      );


    setStatus(
      'Kamera Foto Driver aktif.',
      'ok'
    );


  }catch(err){

    photoStream = null;


    setStatus(
      'Kamera Foto Driver gagal: ' +
      (
        err.message ||
        err
      ),
      'error'
    );

  }

}


// ==================================================
// AMBIL FOTO
// ==================================================

function captureDriverPhoto(){

  const video =
    document.getElementById(
      'photoVideo'
    );


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    return setStatus(
      'Kamera belum siap.',
      'warn'
    );

  }


  const canvas =
    document.getElementById(
      'photoCanvas'
    );


  // perkecil untuk menghemat upload
  const maxWidth =
    900;


  let width =
    video.videoWidth;

  let height =
    video.videoHeight;


  if(
    width >
    maxWidth
  ){

    height =
      Math.round(
        height *
        maxWidth /
        width
      );

    width =
      maxWidth;

  }


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      '2d'
    );


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  photoBase64 =
    canvas.toDataURL(
      'image/jpeg',
      0.65
    );


  const preview =
    document.getElementById(
      'photoPreview'
    );


  preview.src =
    photoBase64;


  preview.style.display =
    'block';


  document
    .getElementById(
      'photoOK'
    )
    .style.display =
    'block';


  closePhotoCamera();


  setStatus(
    '✓ Foto Driver berhasil diambil.',
    'ok'
  );

}


// ==================================================
// TUTUP KAMERA FOTO
// ==================================================

function closePhotoCamera(){

  if(photoStream){

    photoStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

  }


  photoStream = null;


  const video =
    document.getElementById(
      'photoVideo'
    );


  if(video){

    video.srcObject =
      null;

  }


  document
    .getElementById(
      'photoCameraArea'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'openPhotoBtn'
    )
    .classList
    .remove(
      'hidden'
    );

}


// ==================================================
// START SCANNER AWB
// ==================================================

async function startScanner(){

  const driver =
    document
      .getElementById(
        'driver'
      )
      .value
      .trim();


  const platNo =
    document
      .getElementById(
        'platNo'
      )
      .value
      .trim();


  const vendor =
    document
      .getElementById(
        'vendor'
      )
      .value;


  if(!driver){

    return setStatus(
      'Nama Driver wajib diisi.',
      'error'
    );

  }


  if(!platNo){

    return setStatus(
      'Plat No wajib diisi.',
      'error'
    );

  }


  if(!vendor){

    return setStatus(
      'Vendor wajib dipilih.',
      'error'
    );

  }


  if(!photoBase64){

    return setStatus(
      'Ambil Foto Driver terlebih dahulu.',
      'error'
    );

  }


  // pastikan kamera foto sudah mati
  closePhotoCamera();


  try{

    scanner =
      new Html5Qrcode(
        'reader'
      );


    const cameras =
      await Html5Qrcode
        .getCameras();


    if(
      !cameras ||
      !cameras.length
    ){

      throw new Error(
        'Kamera tidak ditemukan'
      );

    }


    let cameraId =
      cameras[
        cameras.length - 1
      ].id;


    const rear =
      cameras.find(
        function(c){

          return /back|rear|environment/i
            .test(
              c.label || ''
            );

        }
      );


    if(rear){

      cameraId =
        rear.id;

    }


    await scanner.start(

      cameraId,

      {

        fps:12,

        qrbox:
          function(w,h){

            return{

              width:
                Math.floor(
                  w * 0.90
                ),

              height:
                Math.min(
                  150,
                  Math.floor(
                    h * 0.40
                  )
                )

            };

          },

        aspectRatio:
          1.7

      },

      onScan,

      function(){}

    );


    document
      .getElementById(
        'startBtn'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'stopBtn'
      )
      .classList
      .remove(
        'hidden'
      );


    setStatus(
      '📦 Scanner aktif. Scan AWB berulang kali.',
      'ok'
    );


  }catch(err){

    scanner = null;


    setStatus(
      'Kamera scanner gagal: ' +
      (
        err.message ||
        err
      ),
      'error'
    );

  }

}


// ==================================================
// STOP SCANNER
// ==================================================

async function stopScanner(){

  if(scanner){

    try{

      await scanner.stop();

      scanner.clear();

    }catch(e){}

  }


  scanner = null;


  document
    .getElementById(
      'startBtn'
    )
    .classList
    .remove(
      'hidden'
    );


  document
    .getElementById(
      'stopBtn'
    )
    .classList
    .add(
      'hidden'
    );


  setStatus(
    'Scanner dihentikan.',
    'warn'
  );

}


// ==================================================
// HASIL SCAN
// ==================================================

function onScan(text){

  const awb =
    String(
      text || ''
    )
      .trim()
      .replace(
        /\s+/g,
        ''
      );


  if(!awb){
    return;
  }


  const now =
    Date.now();


  // kamera sering membaca barcode sama
  // beberapa kali dengan sangat cepat
  if(
    awb === lastCode &&
    now - lastTime <
    1800
  ){

    return;

  }


  lastCode =
    awb;

  lastTime =
    now;


  // duplicate dalam batch lokal
  if(
    awbs.includes(
      awb
    )
  ){

    duplicateCount++;


    document
      .getElementById(
        'duplicate'
      )
      .textContent =
      duplicateCount;


    setStatus(
      '⚠ AWB DUPLIKAT: ' +
      awb,
      'warn'
    );


    if(
      navigator.vibrate
    ){

      navigator.vibrate(
        [100,50,100]
      );

    }


    return;

  }


  awbs.push(
    awb
  );


  render();


  setStatus(
    '✓ AWB ' +
    awb +
    ' ditambahkan.',
    'ok'
  );


  if(
    navigator.vibrate
  ){

    navigator.vibrate(
      60
    );

  }

}


// ==================================================
// RENDER AWB
// ==================================================

function render(){

  const countEl =
    document.getElementById(
      'count'
    );


  const saveBtn =
    document.getElementById(
      'saveBtn'
    );


  const list =
    document.getElementById(
      'awbList'
    );


  countEl.textContent =
    awbs.length;


  saveBtn.textContent =
    '💾 SIMPAN SEMUA (' +
    awbs.length +
    ')';


  list.innerHTML =
    '';


  if(
    awbs.length === 0
  ){

    list.innerHTML =
      '<div class="empty">' +
      'Belum ada AWB yang discan.' +
      '</div>';

    return;

  }


  awbs
    .slice()
    .reverse()
    .forEach(
      function(
        awb,
        reverseIndex
      ){

        const index =
          awbs.length -
          1 -
          reverseIndex;


        const row =
          document.createElement(
            'div'
          );


        row.className =
          'row';


        const text =
          document.createElement(
            'div'
          );


        text.className =
          'awb';


        text.textContent =
          '✓ ' + awb;


        const button =
          document.createElement(
            'button'
          );


        button.textContent =
          'Hapus';


        button.onclick =
          function(){

            awbs.splice(
              index,
              1
            );

            render();

          };


        row.append(
          text,
          button
        );


        list.appendChild(
          row
        );

      }
    );

}


// ==================================================
// CLEAR
// ==================================================

function clearAll(){

  if(
    awbs.length === 0
  ){

    return;

  }


  if(
    !confirm(
      'Hapus semua AWB yang sudah discan?'
    )
  ){

    return;

  }


  awbs = [];

  duplicateCount = 0;


  document
    .getElementById(
      'duplicate'
    )
    .textContent =
    '0';


  render();


  setStatus(
    'Daftar AWB dikosongkan.',
    'warn'
  );

}


// ==================================================
// SIMPAN SEMUA
// ==================================================

async function saveAll(){

  const tanggal =
    document
      .getElementById(
        'tanggal'
      )
      .value;


  const driver =
    document
      .getElementById(
        'driver'
      )
      .value
      .trim();


  const platNo =
    document
      .getElementById(
        'platNo'
      )
      .value
      .trim()
      .toUpperCase();


  const vendor =
    document
      .getElementById(
        'vendor'
      )
      .value;


  if(!tanggal){

    return setStatus(
      'Tanggal Pick Up wajib diisi.',
      'error'
    );

  }


  if(!driver){

    return setStatus(
      'Nama Driver wajib diisi.',
      'error'
    );

  }


  if(!platNo){

    return setStatus(
      'Plat No wajib diisi.',
      'error'
    );

  }


  if(!vendor){

    return setStatus(
      'Vendor wajib dipilih.',
      'error'
    );

  }


  if(!photoBase64){

    return setStatus(
      'Foto Driver wajib diambil.',
      'error'
    );

  }


  if(
    awbs.length === 0
  ){

    return setStatus(
      'Belum ada AWB yang discan.',
      'warn'
    );

  }


  const saveBtn =
    document.getElementById(
      'saveBtn'
    );


  const requestId =
    'REQ_' +
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .slice(2);


  const payload = {

    tanggal:
      tanggal,

    driver:
      driver,

    platNo:
      platNo,

    vendor:
      vendor,

    fotoDriver:
      photoBase64,

    awbs:
      awbs

  };


  document
    .getElementById(
      'formRequestId'
    )
    .value =
    requestId;


  document
    .getElementById(
      'formPayload'
    )
    .value =
    JSON.stringify(
      payload
    );


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    '⏳ MENYIMPAN...';


  setStatus(
    'Sedang menyimpan ' +
    awbs.length +
    ' AWB...',
    'warn'
  );


  document
    .getElementById(
      'saveForm'
    )
    .submit();


  try{

    let result =
      null;


    // tunggu hasil Apps Script
    for(
      let i = 0;
      i < 35;
      i++
    ){

      await new Promise(
        function(resolve){

          setTimeout(
            resolve,
            700
          );

        }
      );


      const data =
        await jsonp({

          action:
            'result',

          requestId:
            requestId

        });


      if(
        !data.pending
      ){

        result =
          data;

        break;

      }

    }


    if(!result){

      throw new Error(
        'Server tidak memberikan respons.'
      );

    }


    if(
      result.success
    ){

      const saved =
        result.saved || 0;


      const duplicates =
        result.duplicateCount || 0;


      setStatus(

        '✓ BERHASIL — ' +
        saved +
        ' AWB tersimpan' +
        (
          duplicates
            ? ' • ' +
              duplicates +
              ' duplikat'
            : ''
        ),

        'ok'

      );


      // setelah save, AWB dikosongkan.
      // driver/plat/vendor/foto tetap.
      awbs = [];

      duplicateCount = 0;


      document
        .getElementById(
          'duplicate'
        )
        .textContent =
        '0';


      render();


    }else{

      setStatus(

        result.message ||
        'Gagal menyimpan data.',

        result.duplicateOnly
          ? 'warn'
          : 'error'

      );

    }


  }catch(err){

    setStatus(
      'Gagal menyimpan: ' +
      err.message,
      'error'
    );

  }


  saveBtn.disabled =
    false;


  render();

}


// ==================================================
// STATUS
// ==================================================

function setStatus(
  text,
  type
){

  const el =
    document.getElementById(
      'status'
    );


  el.className =
    'status ' +
    (
      type || ''
    );


  el.textContent =
    text;

}

</script>

</body>

</html>
