<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<meta name="theme-color" content="#ff6a00">

<title>H JOEL LOGISTICS</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f2f3f5;
  font-family: Arial, Helvetica, sans-serif;
  color: #20252b;
}

.app {
  max-width: 520px;
  margin: auto;
  min-height: 100vh;
  background: white;
}


/* HEADER */

.header {
  padding: 16px;
  text-align: center;
  border-bottom: 4px solid #ff6a00;
}

.logo {
  width: 100%;
  max-width: 340px;
  height: auto;
}

.header-title {
  margin-top: 8px;
  font-size: 20px;
  font-weight: 900;
}


/* CONTENT */

.content {
  padding: 18px;
}


/* MENU */

.menu-title {
  text-align: center;
  font-weight: 900;
  font-size: 18px;
  margin: 12px 0 20px;
}

.menu-grid {
  display: grid;
  gap: 13px;
}

.menu-btn {
  min-height: 75px;
  border: 0;
  border-radius: 13px;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
}

.outbound {
  background: #ff6a00;
  color: white;
}

.bast {
  background: #20252b;
  color: white;
}

.return {
  background: #148c47;
  color: white;
}


/* FORM */

#formPage {
  display: none;
}

.process-header {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 18px;
}

.back-btn {
  width: auto;
  min-width: 52px;
  min-height: 45px;
  border: 0;
  border-radius: 8px;
  background: #eceeef;
  font-size: 20px;
  cursor: pointer;
}

.process-title {
  font-size: 19px;
  font-weight: 900;
}


/* FIELD */

.field {
  margin-bottom: 15px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 700;
}

input,
select,
button {
  width: 100%;
  min-height: 49px;
  border-radius: 9px;
  font-size: 16px;
}

input,
select {
  border: 1px solid #ccd0d5;
  padding: 11px;
  background: white;
}

input:focus,
select:focus {
  outline: 0;
  border-color: #ff6a00;
}

.section-title {
  margin: 22px 0 12px;
  font-size: 15px;
  font-weight: 900;
}

.divider {
  height: 1px;
  background: #eee;
  margin: 22px 0;
}


/* BUTTON */

.btn-orange {
  border: 0;
  background: #ff6a00;
  color: white;
  font-weight: 900;
}

.btn-dark {
  border: 0;
  background: #20252b;
  color: white;
  font-weight: 900;
}

.btn-red {
  border: 0;
  background: #d9342b;
  color: white;
  font-weight: 900;
}

.btn-green {
  border: 0;
  background: #148c47;
  color: white;
  font-weight: 900;
}


/* PHOTO */

#photoCameraBox {
  display: none;
  margin-top: 10px;
}

#photoVideo {
  width: 100%;
  max-height: 420px;
  background: #111;
  border-radius: 12px;
  object-fit: cover;
}

.photo-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

#photoPreviewBox {
  display: none;
  margin-top: 10px;
}

#photoPreview {
  width: 100%;
  border-radius: 10px;
}


/* SCANNER */

#reader {
  width: 100%;
  margin-top: 10px;
  border-radius: 12px;
  overflow: hidden;
}

.scan-buttons {
  display: grid;
  gap: 8px;
}


/* AWB LIST */

.counter-row {
  margin: 13px 0 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.counter {
  background: #20252b;
  color: white;
  padding: 7px 12px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 13px;
}

.clear-btn {
  width: auto;
  min-height: 34px;
  border: 0;
  background: #eee;
  font-size: 12px;
}

.awb-list {
  padding: 9px;
  background: #f5f6f7;
  border-radius: 10px;
  max-height: 280px;
  overflow-y: auto;
}

.awb-empty {
  color: #888;
  text-align: center;
  padding: 15px;
}

.awb-item {
  display: flex;
  gap: 8px;
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 6px;
}

.awb-text {
  flex: 1;
  font-weight: bold;
  word-break: break-all;
}

.delete-btn {
  width: auto;
  min-height: 30px;
  border: 0;
  background: #d9342b;
  color: white;
  font-size: 11px;
}


/* STATUS */

.status {
  display: none;
  margin-top: 15px;
  padding: 12px;
  text-align: center;
  border-radius: 9px;
  font-weight: bold;
}

.status.success {
  display: block;
  background: #e1f5e9;
  color: #14723b;
}

.status.error {
  display: block;
  background: #fde5e3;
  color: #b1261c;
}

.status.info {
  display: block;
  background: #fff0df;
  color: #975300;
}

.footer {
  text-align: center;
  padding: 20px;
  color: #aaa;
  font-size: 11px;
}

</style>

</head>


<body>


<div class="app">


<div class="header">

<img
  src="./H_JOEL_LOGISTICS_logo.png"
  class="logo"
  alt="H JOEL LOGISTICS"
>

<div class="header-title">
OPERASIONAL DISTRIBUSI
</div>

</div>



<div class="content">


<!-- ==============================================
MENU UTAMA
============================================== -->

<div id="menuPage">

<div class="menu-title">
PILIH PROSES
</div>

<div class="menu-grid">


<button
  class="menu-btn outbound"
  onclick="selectProcess('OUTBOUND')"
>
📦 OUTBOUND
</button>


<button
  class="menu-btn bast"
  onclick="selectProcess('BAST')"
>
🏭 BAST BACK TO WH
</button>


<button
  class="menu-btn return"
  onclick="selectProcess('RETURN')"
>
↩️ RETURN
</button>


</div>

</div>



<!-- ==============================================
FORM
============================================== -->

<div id="formPage">


<div class="process-header">

<button
  class="back-btn"
  onclick="backMenu()"
>
←
</button>

<div
  class="process-title"
  id="processTitle"
>
</div>

</div>



<div class="field">

<label id="tanggalLabel">
Tanggal
</label>

<input
  type="date"
  id="tanggal"
>

</div>



<div class="field">

<label>
Nama Driver
</label>

<input
  type="text"
  id="namaDriver"
  placeholder="Masukkan nama driver"
  autocomplete="off"
>

</div>



<div class="field">

<label>
Plat No
</label>

<input
  type="text"
  id="platNo"
  placeholder="Contoh: F 1234 ABC"
  autocomplete="off"
  oninput="this.value=this.value.toUpperCase()"
>

</div>



<div class="field">

<label>
Vendor
</label>

<select id="vendor">

<option value="">
Memuat Vendor...
</option>

</select>

</div>



<div
  class="field"
  id="keteranganBox"
  style="display:none;"
>

<label>
Keterangan
</label>

<select id="keterangan">

<option value="">
-- Pilih Keterangan --
</option>

</select>

</div>



<div class="divider"></div>



<!-- FOTO DRIVER -->

<div class="section-title">
FOTO DRIVER
</div>


<button
  class="btn-orange"
  id="btnOpenPhoto"
  onclick="openPhotoCamera()"
>
📷 BUKA KAMERA DRIVER
</button>


<div id="photoCameraBox">

<video
  id="photoVideo"
  autoplay
  playsinline
  muted
></video>


<div class="photo-actions">

<button
  class="btn-green"
  onclick="capturePhoto()"
>
📸 AMBIL FOTO
</button>

<button
  class="btn-red"
  onclick="closePhotoCamera()"
>
TUTUP
</button>

</div>

</div>



<div id="photoPreviewBox">

<img
  id="photoPreview"
>

<button
  class="btn-orange"
  style="margin-top:8px;"
  onclick="openPhotoCamera()"
>
🔄 FOTO ULANG
</button>

</div>



<div class="divider"></div>



<!-- SCAN -->

<div class="section-title">
SCAN AWB
</div>


<div class="scan-buttons">


<button
  class="btn-dark"
  id="btnStartScanner"
  onclick="startScanner()"
>
📷 MULAI SCAN AWB
</button>


<button
  class="btn-red"
  id="btnStopScanner"
  onclick="stopScanner()"
  style="display:none;"
>
⛔ STOP SCANNER
</button>


</div>


<div id="reader"></div>



<div class="counter-row">

<div
  class="counter"
  id="awbCounter"
>
0 AWB
</div>


<button
  class="clear-btn"
  onclick="clearAwbs()"
>
Hapus Semua
</button>

</div>



<div
  class="awb-list"
  id="awbList"
>

Belum ada AWB.
</div>

</div>



<div class="divider"></div>

  class="btn-green"
  id="btnSave"
  onclick="saveData()"
>
💾 SIMPAN DATA
</button>

  id="status"
  class="status"
></div>


</div>


</div>



<div class="footer">
H JOEL LOGISTICS
</div>


</div>



<script>


const API_URL =
'https://script.google.com/macros/s/AKfycbwvSTmZkm9CGrEW3kJG8Du_THFSNX0fE49y97wElfXzANkfewhp-LuMtyPqZD8P4DWwCg/exec';


let currentProcess = '';

let scannedAwbs = [];

let scanner = null;

let scanLock = false;

let photoStream = null;

let photoBase64 = '';

let audioContext = null;



document.addEventListener(
'DOMContentLoaded',
function() {

setToday();

loadValidation();

}
);



/* ============================================
MENU
============================================ */

function selectProcess(
process
) {

currentProcess =
process;


document.getElementById(
'menuPage'
).style.display =
'none';


document.getElementById(
'formPage'
).style.display =
'block';


const title =
document.getElementById(
'processTitle'
);


const tanggalLabel =
document.getElementById(
'tanggalLabel'
);


const ket =
document.getElementById(
'keteranganBox'
);


if (
process === 'OUTBOUND'
) {

title.textContent =
'OUTBOUND';

tanggalLabel.textContent =
'Tanggal Pick Up';

ket.style.display =
'none';

}


else if (
process === 'BAST'
) {

title.textContent =
'BAST BACK TO WH';

tanggalLabel.textContent =
'Tanggal Back to WH';

ket.style.display =
'none';

}


else {

title.textContent =
'RETURN';

tanggalLabel.textContent =
'Tanggal Return';

ket.style.display =
'block';

}


setToday();

clearStatus();

}



async function backMenu() {

await stopScanner();

closePhotoCamera();


document.getElementById(
'formPage'
).style.display =
'none';


document.getElementById(
'menuPage'
).style.display =
'block';

}



/* ============================================
TODAY
============================================ */

function setToday() {

const now =
new Date();


const y =
now.getFullYear();


const m =
String(
now.getMonth() + 1
).padStart(
2,
'0'
);


const d =
String(
now.getDate()
).padStart(
2,
'0'
);


document.getElementById(
'tanggal'
).value =
y +
'-' +
m +
'-' +
d;

}



/* ============================================
VALIDATION
============================================ */

function loadValidation() {

const callback =
'validation_' +
Date.now();


const script =
document.createElement(
'script'
);


window[callback] =
function(data) {


const vendor =
document.getElementById(
'vendor'
);


const ket =
document.getElementById(
'keterangan'
);


vendor.innerHTML =
'<option value="">-- Pilih Vendor --</option>';


ket.innerHTML =
'<option value="">-- Pilih Keterangan --</option>';


if (
data &&
data.success
) {


(data.vendors || [])
.forEach(
function(v) {


const option =
document.createElement(
'option'
);


option.value =
v;


option.textContent =
v;


vendor.appendChild(
option
);


}
);



(data.keterangans || [])
.forEach(
function(v) {


const option =
document.createElement(
'option'
);


option.value =
v;


option.textContent =
v;


ket.appendChild(
option
);


}
);


}


delete window[
callback
];


script.remove();

};


script.onerror =
function() {

showStatus(
'Validation gagal dimuat.',
'error'
);

};


script.src =
API_URL +
'?action=getValidation' +
'&callback=' +
callback +
'&t=' +
Date.now();


document.body.appendChild(
script
);

}



/* ============================================
PHOTO
============================================ */

async function openPhotoCamera() {

clearStatus();


if (scanner) {

await stopScanner();

}


closePhotoCamera();


try {


photoStream =
await navigator
.mediaDevices
.getUserMedia({

video: {

facingMode: {
ideal:
'environment'
}

},

audio:
false

});


const video =
document.getElementById(
'photoVideo'
);


video.srcObject =
photoStream;


await video.play();


document.getElementById(
'photoCameraBox'
).style.display =
'block';


document.getElementById(
'btnOpenPhoto'
).style.display =
'none';


} catch(error) {


showStatus(
'Kamera tidak dapat dibuka. Izinkan kamera browser.',
'error'
);


}

}



function capturePhoto() {

const video =
document.getElementById(
'photoVideo'
);


if (
!video.videoWidth
) {

return;

}


const canvas =
document.createElement(
'canvas'
);


let width =
video.videoWidth;


let height =
video.videoHeight;


if (
width > 1280
) {


height =
Math.round(
height *
1280 /
width
);


width =
1280;


}


canvas.width =
width;


canvas.height =
height;


canvas
.getContext('2d')
.drawImage(
video,
0,
0,
width,
height
);


photoBase64 =
canvas.toDataURL(
'image/jpeg',
.72
);


document.getElementById(
'photoPreview'
).src =
photoBase64;


document.getElementById(
'photoPreviewBox'
).style.display =
'block';


closePhotoCamera();


showStatus(
'Foto Driver berhasil.',
'success'
);

}



function closePhotoCamera() {

if (
photoStream
) {


photoStream
.getTracks()
.forEach(
track =>
track.stop()
);


photoStream =
null;


}


const video =
document.getElementById(
'photoVideo'
);


if (video) {

video.srcObject =
null;

}


document.getElementById(
'photoCameraBox'
).style.display =
'none';


document.getElementById(
'btnOpenPhoto'
).style.display =
'block';

}



/* ============================================
SCANNER
============================================ */

async function startScanner() {

clearStatus();


try {


if (
!audioContext
) {


audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();


}


if (
audioContext.state ===
'suspended'
) {


await audioContext.resume();


}


} catch(error) {}


closePhotoCamera();


if (scanner) {

return;

}


try {


const cameras =
await Html5Qrcode
.getCameras();


if (
!cameras.length
) {

throw new Error();

}


let cameraId =
cameras[
cameras.length - 1
].id;


const rear =
cameras.find(
c =>
/back|rear|environment/i
.test(c.label)
);


if (rear) {

cameraId =
rear.id;

}


scanner =
new Html5Qrcode(
'reader'
);


await scanner.start(

cameraId,

{

fps:
12,

qrbox:
function(width) {


let w =
Math.floor(
width *
.9
);


if (
w >
380
) {

w =
380;

}


return {

width:
w,

height:
140

};

}

},

scanSuccess,

function(){}

);


document.getElementById(
'btnStartScanner'
).style.display =
'none';


document.getElementById(
'btnStopScanner'
).style.display =
'block';


showStatus(
'Scanner aktif.',
'info'
);


} catch(error) {


scanner =
null;


showStatus(
'Kamera scanner gagal dibuka.',
'error'
);


}

}



function scanSuccess(
decoded
) {

if (
scanLock
) {

return;

}


const awb =
String(decoded)
.trim();


if (!awb) {

return;

}


scanLock =
true;


if (
scannedAwbs.includes(
awb
)
) {


duplicateBeep();


if (
navigator.vibrate
) {

navigator.vibrate([
100,
70,
100
]);

}


showStatus(
'AWB sudah pernah discan: ' +
awb,
'error'
);


} else {


scannedAwbs.push(
awb
);


renderAwbs();


successBeep();


if (
navigator.vibrate
) {

navigator.vibrate(
120
);

}


showStatus(
'SCAN BERHASIL: ' +
awb,
'success'
);


}


setTimeout(
function() {

scanLock =
false;

},
1000
);

}



async function stopScanner() {

if (!scanner) {

return;

}


try {


await scanner.stop();


scanner.clear();


} catch(error) {}


scanner =
null;


document.getElementById(
'btnStartScanner'
).style.display =
'block';


document.getElementById(
'btnStopScanner'
).style.display =
'none';

}



/* ============================================
SOUND
============================================ */

function successBeep() {

try {


const oscillator =
audioContext
.createOscillator();


const gain =
audioContext
.createGain();


oscillator.connect(
gain
);


gain.connect(
audioContext.destination
);


oscillator.frequency.value =
1100;


gain.gain.value =
.28;


oscillator.start();


oscillator.stop(
audioContext.currentTime +
.15
);


} catch(error) {}

}



function duplicateBeep() {

try {


const oscillator =
audioContext
.createOscillator();


const gain =
audioContext
.createGain();


oscillator.connect(
gain
);


gain.connect(
audioContext.destination
);


oscillator.frequency.value =
350;


gain.gain.value =
.20;


oscillator.start();


oscillator.stop(
audioContext.currentTime +
.22
);


} catch(error) {}

}



/* ============================================
AWB LIST
============================================ */

function renderAwbs() {

const list =
document.getElementById(
'awbList'
);


document.getElementById(
'awbCounter'
).textContent =
scannedAwbs.length +
' AWB';


if (
scannedAwbs.length === 0
) {


list.innerHTML =
'<div class="awb-empty">Belum ada AWB.</div>';


return;


}


list.innerHTML =
'';


scannedAwbs.forEach(
function(
awb,
index
) {


const row =
document.createElement(
'div'
);


row.className =
'awb-item';


const text =
document.createElement(
'div'
);


text.className =
'awb-text';


text.textContent =
(index + 1) +
'. ' +
awb;


const del =
document.createElement(
'button'
);


del.className =
'delete-btn';


del.textContent =
'Hapus';


del.onclick =
function() {


scannedAwbs.splice(
index,
1
);


renderAwbs();


};


row.appendChild(
text
);


row.appendChild(
del
);


list.appendChild(
row
);


}
);

}



function clearAwbs() {

if (
!scannedAwbs.length
) {

return;

}


if (
!confirm(
'Hapus semua AWB?'
)
) {

return;

}


scannedAwbs =
[];


renderAwbs();

}



/* ============================================
SAVE
============================================ */

async function saveData() {

  clearStatus();

  const tanggal =
    document.getElementById(
      'tanggal'
    ).value;

  const driver =
    document.getElementById(
      'namaDriver'
    ).value.trim();

  const plat =
    document.getElementById(
      'platNo'
    ).value.trim();

  const vendor =
    document.getElementById(
      'vendor'
    ).value;

  const keterangan =
    document.getElementById(
      'keterangan'
    ).value;


  if (!tanggal) {
    return showStatus(
      'Tanggal wajib diisi.',
      'error'
    );
  }

  if (!driver) {
    return showStatus(
      'Nama Driver wajib diisi.',
      'error'
    );
  }

  if (!plat) {
    return showStatus(
      'Plat No wajib diisi.',
      'error'
    );
  }

  if (!vendor) {
    return showStatus(
      'Vendor wajib dipilih.',
      'error'
    );
  }

  if (
    currentProcess === 'RETURN' &&
    !keterangan
  ) {
    return showStatus(
      'Keterangan Return wajib dipilih.',
      'error'
    );
  }

  if (!photoBase64) {
    return showStatus(
      'Foto Driver wajib diambil.',
      'error'
    );
  }

  if (
    scannedAwbs.length === 0
  ) {
    return showStatus(
      'Belum ada AWB.',
      'error'
    );
  }


  const btn =
    document.getElementById(
      'btnSave'
    );

  btn.disabled =
    true;

  btn.textContent =
    'MENYIMPAN...';


  try {

    await stopScanner();

    closePhotoCamera();


    const payload = {

      action: 'save',

      process:
        currentProcess,

      tanggal:
        tanggal,

      namaDriver:
        driver,

      platNo:
        plat,

      vendor:
        vendor,

      keterangan:
        keterangan,

      awbs:
        scannedAwbs,

      fotoDriver:
        photoBase64

    };


    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify(
              payload
            )
        }
      );


    const result =
      JSON.parse(
        await response.text()
      );


    if (!result.success) {
      throw new Error(
        result.message ||
        'Gagal menyimpan.'
      );
    }


    /*
    =========================================
    DATA BERHASIL DISIMPAN
    =========================================
    */

    alert(
      result.jumlah +
      ' AWB berhasil disimpan ke ' +
      result.sheet
    );


    /*
    Kosongkan semua data.
    */

    document.getElementById(
      'namaDriver'
    ).value = '';

    document.getElementById(
      'platNo'
    ).value = '';

    document.getElementById(
      'vendor'
    ).selectedIndex = 0;

    document.getElementById(
      'keterangan'
    ).selectedIndex = 0;


    scannedAwbs = [];

    renderAwbs();


    photoBase64 = '';


    document.getElementById(
      'photoPreview'
    ).src = '';


    document.getElementById(
      'photoPreviewBox'
    ).style.display =
      'none';


    /*
    Reset tanggal hari ini.
    */

    setToday();


    /*
    Reset proses.
    */

    currentProcess = '';


    /*
    Tutup form.
    */

    document.getElementById(
      'formPage'
    ).style.display =
      'none';


    /*
    Tampilkan menu depan.
    */

    document.getElementById(
      'menuPage'
    ).style.display =
      'block';


    /*
    Sembunyikan Keterangan.
    */

    document.getElementById(
      'keteranganBox'
    ).style.display =
      'none';


    /*
    Bersihkan status.
    */

    clearStatus();


    /*
    Kembali ke atas.
    */

    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });


  } catch(error) {

    showStatus(
      'Gagal menyimpan: ' +
      error.message,
      'error'
    );

  }


  btn.disabled =
    false;

  btn.textContent =
    '💾 SIMPAN DATA';

}


/* ============================================
STATUS
============================================ */

function showStatus(
message,
type
) {


const status =
document.getElementById(
'status'
);


status.className =
'status ' +
type;


status.textContent =
message;


}



function clearStatus() {


const status =
document.getElementById(
'status'
);


status.className =
'status';


status.textContent =
'';


}


</script>

</html>
