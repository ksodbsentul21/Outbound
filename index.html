<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#ff6a00">

<title>H JOEL LOGISTICS</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f2f3f5;
  font-family:Arial,Helvetica,sans-serif;
  color:#20252b;
}

.app{

  margin:auto;

}

.header{
  padding:15px;

  background:white;

}

.logo{
  width:100%;
  max-width:350px;
  display:block;
  margin:auto;
}

.header-title{
  margin-top:8px;
  font-size:20px;
  font-weight:900;
}

.content{
  padding:18px;
}

/* MENU */

.menu-title{
  text-align:center;
  font-size:18px;
  font-weight:900;
  margin:12px 0 20px;
}

.menu-grid{
  display:grid;
  gap:13px;
}

.menu-btn{
  width:100%;
  min-height:75px;
  border:0;
  border-radius:13px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.outbound{
  background:#ff6a00;
  color:white;
}

.bast{
  background:#20252b;
  color:white;
}

.return{
  background:#148c47;
  color:white;
}

/* FORM */

#formPage{
  display:none;
}

.process-header{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.back-btn{
  width:52px;
  min-height:45px;
  border:0;
  border-radius:8px;
  background:#eceeef;
  font-size:21px;
  cursor:pointer;
}

.process-title{
  font-size:20px;
  font-weight:900;
}

/* FIELD */

.field{
  margin-bottom:15px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:6px;
}

input,
select,
button{
  font-family:Arial,Helvetica,sans-serif;
  font-size:16px;
  border-radius:9px;
}

input,
select{
  width:100%;
  min-height:49px;
  padding:11px;
  background:white;
  border:1px solid #ccd0d5;
  outline:none;
}

input:focus,
select:focus{
  border-color:#ff6a00;

}

.section-title{
  font-size:15px;
  font-weight:900;
  margin:20px 0 12px;
}

.divider{
  height:1px;
  background:#eee;
  margin:22px 0;
}

/* BUTTON */

button{
  cursor:pointer;
}

.btn-orange,
.btn-dark,
.btn-red,
.btn-green{
  width:100%;
  min-height:49px;
  border:0;
  font-weight:900;
}

.btn-orange{
  background:#ff6a00;
  color:white;
}

.btn-dark{
  background:#20252b;
  color:white;
}

.btn-red{
  background:#d9342b;
  color:white;
}

.btn-green{
  background:#148c47;
  color:white;
}

button:disabled{
  opacity:.5;
}

/* RETURN */

#keteranganBox{
  display:none;
}

#reasonBox{
  display:none;
}

.reason-note{
  margin-top:5px;
  color:#888;
  font-size:11px;
}

/* FOTO */

#photoCameraBox{
  display:none;
  margin-top:10px;
}

#photoVideo{
  width:100%;
  max-height:420px;
  object-fit:cover;
  background:#111;
  border-radius:12px;
}

.photo-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

#photoPreviewBox{
  display:none;
  margin-top:10px;
}

#photoPreview{
  display:block;
  width:100%;
  max-height:380px;
  object-fit:contain;
  border-radius:10px;
  background:#f5f5f5;
}

/* SCANNER */

#reader{
  width:100%;
  margin-top:10px;
  overflow:hidden;
  border-radius:12px;
  background:#111;
}

.scan-buttons{
  display:grid;
  gap:8px;
}

/* AWB */

.counter-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:13px 0 8px;
}

.counter{
  background:#20252b;
  color:white;
  border-radius:20px;
  padding:7px 12px;
  font-size:13px;
  font-weight:bold;
}

.clear-btn{
  width:auto;
  min-height:34px;
  border:0;
  background:#eee;
  padding:6px 12px;
  font-size:12px;
}

.awb-list{
  max-height:280px;
  overflow-y:auto;
  background:#f5f6f7;
  border-radius:10px;
  padding:9px;
}

.awb-empty{
  text-align:center;
  color:#888;
  padding:15px;
}

.awb-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  background:white;
  border:1px solid #ddd;
  border-radius:8px;
  margin-bottom:6px;
}

.awb-text{
  flex:1;
  font-size:14px;
  font-weight:bold;
  word-break:break-all;
}

.delete-btn{
  width:auto;
  min-height:31px;
  border:0;
  background:#d9342b;
  color:white;
  padding:5px 8px;
  font-size:11px;
}

/* STATUS */

.status{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  text-align:center;
  font-weight:bold;
  line-height:1.4;
}

.status.success{
  display:block;
  background:#e1f5e9;
  color:#14723b;
}

.status.error{
  display:block;
  background:#fde5e3;
  color:#b1261c;
}

.status.info{
  display:block;
  background:#fff0df;
  color:#975300;
}

.footer{
  padding:20px;
  text-align:center;
  color:#aaa;
  font-size:11px;
}

</style>
</head>

<body>

<div class="app">

  <div class="header">

    <img
      src="./H_JOEL_LOGISTICS_logo.png"
      class="logo"
      alt="H JOEL LOGISTICS"
    >

    <div class="header-title">
      OPERASIONAL DISTRIBUSI
    </div>

  </div>


  <div class="content">

    <!-- MENU DEPAN -->

    <div id="menuPage">

      <div class="menu-title">
        PILIH PROSES
      </div>

      <div class="menu-grid">

        <button
          type="button"
          class="menu-btn outbound"

          type="button"
          class="menu-btn return"
          onclick="selectProcess('RETURN')"

          ↩️ RETURN
        </button>

      </div>

    </div>


    <!-- FORM -->

    <div id="formPage">

      <div class="process-header">

        <button
          type="button"
          class="back-btn"
          onclick="backMenu()"
        >
          ←
        </button>

        <div
          class="process-title"
          id="processTitle"

      </div>


      <div class="field">

        <label id="tanggalLabel">
          Tanggal
        </label>

        <input
          type="date"
          id="tanggal"

      </div>


      <div class="field">

        <label>
          Nama Driver
        </label>

        <input
          type="text"
          id="namaDriver"
          placeholder="Masukkan Nama Driver"
          autocomplete="off"
        >

      </div>


      <div class="field">

        <label>
          Plat No
        </label>

        <input
          type="text"
          id="platNo"
          placeholder="Contoh: F 1234 ABC"
          autocomplete="off"
          oninput="this.value=this.value.toUpperCase()"
        >

      </div>


      <div class="field">

        <label>
          Vendor
        </label>

        <select id="vendor">

          <option value="">
            Memuat Vendor...
          </option>

        </select>

      </div>


      <!-- KHUSUS RETURN -->

      <div
        class="field"
        id="keteranganBox"
      >

        <label>
          Keterangan
        </label>

        <select id="keterangan">

          <option value="">
            -- Pilih Keterangan --
          </option>

        </select>

      </div>


      <!-- REASON RETURN - KETIK MANUAL -->

      <div
        class="field"
        id="reasonBox"
      >

        <label>
          Reason
        </label>

        <input
          type="text"
          id="reason"
          placeholder="Ketik Reason"

        >

          Reason diisi manual.
        </div>

      </div>


      <div class="divider"></div>


      <!-- FOTO DRIVER -->

      <div class="section-title">
        FOTO DRIVER
      </div>


      <button
        type="button"
        class="btn-orange"
        id="btnOpenPhoto"
        onclick="openPhotoCamera()"
      >
        📷 BUKA KAMERA DRIVER
      </button>


      <div id="photoCameraBox">

        <video
          id="photoVideo"
          autoplay
          playsinline
          muted
        ></video>


        <div class="photo-actions">

          <button
            type="button"
            class="btn-green"
            onclick="capturePhoto()"
          >
            📸 AMBIL FOTO
          </button>

          <button
            type="button"
            class="btn-red"
            onclick="closePhotoCamera()"
          >
            TUTUP
          </button>

        </div>

      </div>


      <div id="photoPreviewBox">

        <img
          id="photoPreview"
          alt="Foto Driver"
        >

        <button
          type="button"
          class="btn-orange"
          style="margin-top:8px;"
          onclick="openPhotoCamera()"
        >
          🔄 FOTO ULANG
        </button>

      </div>


      <div class="divider"></div>


      <!-- SCAN AWB -->

      <div class="section-title">
        SCAN AWB
      </div>

        <button

        <button

          ⛔ STOP SCANNER
        </button>

      <div id="reader"></div>


      <div class="counter-row">

        <div

        <button

        </div>

        class="status"

    </div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbwvSTmZkm9CGrEW3kJG8Du_THFSNX0fE49y97wElfXzANkfewhp-LuMtyPqZD8P4DWwCg/exec';


let currentProcess = '';

let scannedAwbs = [];

let scanner = null;

let scanLock = false;

let photoStream = null;

let photoBase64 = '';

let audioContext = null;


/* =====================================================
START
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function(){

    setToday();

    loadValidation();

  }
);


/* =====================================================
MENU
===================================================== */

function selectProcess(process){

  currentProcess =
    process;


  document.getElementById(
    'menuPage'
  ).style.display =
    'none';


  document.getElementById(
    'formPage'
  ).style.display =
    'block';


  const title =
    document.getElementById(
      'processTitle'
    );


  const tanggalLabel =
    document.getElementById(
      'tanggalLabel'
    );


  const keteranganBox =
    document.getElementById(
      'keteranganBox'
    );


  const reasonBox =
    document.getElementById(
      'reasonBox'
    );


  if(process === 'OUTBOUND'){

    title.textContent =
      'OUTBOUND';


    tanggalLabel.textContent =
      'Tanggal Pick Up';


    keteranganBox.style.display =
      'none';


    reasonBox.style.display =
      'none';

  }


  else if(process === 'BAST'){

    title.textContent =
      'BAST BACK TO WH';


    tanggalLabel.textContent =
      'Tanggal Back to WH';


    keteranganBox.style.display =
      'none';


    reasonBox.style.display =
      'none';

  }


  else if(process === 'RETURN'){

    title.textContent =
      'RETURN';


    tanggalLabel.textContent =
      'Tanggal Return';


    /*
    PASTI TAMPIL DI RETURN
    */
    keteranganBox.style.display =
      'block';


    reasonBox.style.display =
      'block';

  }


  setToday();

  clearStatus();


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =====================================================
BACK
===================================================== */

async function backMenu(){

  await stopScanner();

  closePhotoCamera();


  document.getElementById(
    'formPage'
  ).style.display =
    'none';


  document.getElementById(
    'menuPage'
  ).style.display =
    'block';


  clearStatus();


  window.scrollTo(
    0,
    0
  );

}


/* =====================================================
TODAY
===================================================== */

function setToday(){

  const now =
    new Date();


  const y =
    now.getFullYear();


  const m =
    String(
      now.getMonth()+1
    ).padStart(2,'0');


  const d =
    String(
      now.getDate()
    ).padStart(2,'0');


  document.getElementById(
    'tanggal'
  ).value =
    y+'-'+m+'-'+d;

}


/* =====================================================
VALIDATION
===================================================== */

function loadValidation(){

  const callbackName =
    'validationCallback_' +
    Date.now();


  const script =
    document.createElement(
      'script'
    );


  window[callbackName] =
    function(data){


      const vendor =
        document.getElementById(
          'vendor'
        );


      const keterangan =
        document.getElementById(
          'keterangan'
        );


      vendor.innerHTML =
        '<option value="">-- Pilih Vendor --</option>';


      keterangan.innerHTML =
        '<option value="">-- Pilih Keterangan --</option>';


      if(
        data &&
        data.success
      ){


        const vendors =
          data.vendors || [];


        const keterangans =
          data.keterangans || [];


        vendors.forEach(
          function(item){


            const option =
              document.createElement(
                'option'
              );


            option.value =
              item;


            option.textContent =
              item;


            vendor.appendChild(
              option
            );


          }
        );


        keterangans.forEach(
          function(item){


            const option =
              document.createElement(
                'option'
              );


            option.value =
              item;


            option.textContent =
              item;


            keterangan.appendChild(
              option
            );


          }
        );


      }else{


        showStatus(
          'Validation gagal dimuat.',
          'error'
        );


      }


      delete window[
        callbackName
      ];


      script.remove();

    };


  script.onerror =
    function(){

      showStatus(
        'Validation gagal dimuat dari Google Sheet.',
        'error'
      );

    };


  script.src =
    API_URL +
    '?action=getValidation' +
    '&callback=' +
    callbackName +
    '&t=' +
    Date.now();


  document.body.appendChild(
    script
  );

}


/* =====================================================
FOTO
===================================================== */

async function openPhotoCamera(){

  clearStatus();


  if(scanner){

    await stopScanner();

  }


  closePhotoCamera();


  try{


    photoStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:'environment'
            }
          },

          audio:false

        });


    const video =
      document.getElementById(
        'photoVideo'
      );


    video.srcObject =
      photoStream;


    await video.play();


    document.getElementById(
      'photoCameraBox'
    ).style.display =
      'block';


    document.getElementById(
      'btnOpenPhoto'
    ).style.display =
      'none';


    showStatus(
      'Kamera Driver aktif.',
      'info'
    );


  }catch(error){


    console.error(error);


    showStatus(
      'Kamera tidak dapat dibuka. Izinkan kamera pada browser.',
      'error'
    );


  }

}


/* =====================================================
AMBIL FOTO
===================================================== */

function capturePhoto(){

  const video =
    document.getElementById(
      'photoVideo'
    );


  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    showStatus(
      'Kamera belum siap.',
      'error'
    );

    return;

  }


  const canvas =
    document.createElement(
      'canvas'
    );


  let width =
    video.videoWidth;


  let height =
    video.videoHeight;


  if(width > 1280){

    height =
      Math.round(
        height *
        1280 /
        width
      );


    width =
      1280;

  }


  canvas.width =
    width;


  canvas.height =
    height;


  const context =
    canvas.getContext(
      '2d'
    );


  context.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  photoBase64 =
    canvas.toDataURL(
      'image/jpeg',
      .72
    );


  document.getElementById(
    'photoPreview'
  ).src =
    photoBase64;


  document.getElementById(
    'photoPreviewBox'
  ).style.display =
    'block';


  closePhotoCamera();


  showStatus(
    'Foto Driver berhasil diambil.',
    'success'
  );

}


/* =====================================================
CLOSE FOTO
===================================================== */

function closePhotoCamera(){

  if(photoStream){

    photoStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );


    photoStream =
      null;

  }


  const video =
    document.getElementById(
      'photoVideo'
    );


  if(video){

    video.srcObject =
      null;

  }


  document.getElementById(
    'photoCameraBox'
  ).style.display =
    'none';


  document.getElementById(
    'btnOpenPhoto'
  ).style.display =
    'block';

}


/* =====================================================
START SCANNER
===================================================== */

async function startScanner(){

  clearStatus();


  try{


    if(!audioContext){

      audioContext =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if(
      audioContext.state ===
      'suspended'
    ){

      await audioContext.resume();

    }


  }catch(error){}


  closePhotoCamera();


  if(scanner){
    return;
  }


  try{


    const cameras =
      await Html5Qrcode
        .getCameras();


    if(
      !cameras ||
      !cameras.length
    ){

      throw new Error(
        'Kamera tidak ditemukan.'
      );

    }


    let cameraId =
      cameras[
        cameras.length-1
      ].id;


    const rear =
      cameras.find(
        function(camera){

          return /back|rear|environment/i
            .test(
              camera.label
            );

        }
      );


    if(rear){

      cameraId =
        rear.id;

    }


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      cameraId,

      {

        fps:12,

        qrbox:
          function(width){

            let w =
              Math.floor(
                width*.90
              );


            if(w>380){
              w=380;
            }


            return{
              width:w,
              height:140
            };

          }

      },

      scanSuccess,

      function(){}

    );


    document.getElementById(
      'btnStartScanner'
    ).style.display =
      'none';


    document.getElementById(
      'btnStopScanner'
    ).style.display =
      'block';


    showStatus(
      'Scanner aktif. Arahkan barcode AWB ke kamera.',
      'info'
    );


  }catch(error){


    console.error(error);


    scanner =
      null;


    showStatus(
      'Kamera scanner gagal dibuka.',
      'error'
    );


  }

}


/* =====================================================
SCAN SUCCESS
===================================================== */

function scanSuccess(decodedText){

  if(scanLock){
    return;
  }


  const awb =
    String(
      decodedText || ''
    ).trim();


  if(!awb){
    return;
  }


  scanLock =
    true;


  if(
    scannedAwbs.includes(
      awb
    )
  ){


    duplicateBeep();


    if(
      navigator.vibrate
    ){

      navigator.vibrate([
        100,
        70,
        100
      ]);

    }


    showStatus(
      'AWB sudah pernah discan: '+awb,
      'error'
    );


  }else{


    scannedAwbs.push(
      awb
    );


    renderAwbs();


    successBeep();


    if(
      navigator.vibrate
    ){

      navigator.vibrate(
        120
      );

    }


    showStatus(
      'SCAN BERHASIL: '+awb,
      'success'
    );

  }


  setTimeout(
    function(){

      scanLock =
        false;

    },
    1000
  );

}


/* =====================================================
STOP SCANNER
===================================================== */

async function stopScanner(){

  if(!scanner){
    return;
  }


  try{

    await scanner.stop();

    scanner.clear();

  }catch(error){}


  scanner =
    null;


  document.getElementById(
    'btnStartScanner'
  ).style.display =
    'block';


  document.getElementById(
    'btnStopScanner'
  ).style.display =
    'none';

}


/* =====================================================
BEEP
===================================================== */

function successBeep(){

  try{


    if(!audioContext){
      return;
    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      1100;


    gain.gain.value =
      .28;


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      .15
    );


  }catch(error){}

}


function duplicateBeep(){

  try{


    if(!audioContext){
      return;
    }


    const oscillator =
      audioContext
        .createOscillator();


    const gain =
      audioContext
        .createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      350;


    gain.gain.value =
      .20;


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      .22
    );


  }catch(error){}

}


/* =====================================================
AWB LIST
===================================================== */

function renderAwbs(){

  const list =
    document.getElementById(
      'awbList'
    );


  document.getElementById(
    'awbCounter'
  ).textContent =
    scannedAwbs.length +
    ' AWB';


  if(
    scannedAwbs.length === 0
  ){


    list.innerHTML =
      '<div class="awb-empty">Belum ada AWB.</div>';


    return;

  }


  list.innerHTML =
    '';


  scannedAwbs.forEach(
    function(
      awb,
      index
    ){


      const row =
        document.createElement(
          'div'
        );


      row.className =
        'awb-item';


      const text =
        document.createElement(
          'div'
        );


      text.className =
        'awb-text';


      text.textContent =
        (index+1)+
        '. '+
        awb;


      const del =
        document.createElement(
          'button'
        );


      del.type =
        'button';


      del.className =
        'delete-btn';


      del.textContent =
        'Hapus';


      del.onclick =
        function(){


          scannedAwbs.splice(
            index,
            1
          );


          renderAwbs();


        };


      row.appendChild(
        text
      );


      row.appendChild(
        del
      );


      list.appendChild(
        row
      );


    }
  );

}


/* =====================================================
CLEAR AWB
===================================================== */

function clearAwbs(){

  if(
    scannedAwbs.length === 0
  ){
    return;
  }


  if(
    !confirm(
      'Hapus semua AWB?'
    )
  ){
    return;
  }


  scannedAwbs =
    [];


  renderAwbs();

}


/* =====================================================
RESET
===================================================== */

function resetApplication(){

  document.getElementById(
    'namaDriver'
  ).value =
    '';


  document.getElementById(
    'platNo'
  ).value =
    '';


  document.getElementById(
    'vendor'
  ).selectedIndex =
    0;


  document.getElementById(
    'keterangan'

    0;


  /*
  REASON IKUT DIKOSONGKAN
  */
  document.getElementById(

  renderAwbs();

    '';


  document.getElementById(

    '';


  document.getElementById(

  document.getElementById(
    'keteranganBox'

    'none';


  document.getElementById(
    'reasonBox'
  ).style.display =

/* =====================================================
SAVE
===================================================== */

async function saveData(){

  clearStatus();


  const tanggal =
    document.getElementById(
      'tanggal'
    ).value;


  const driver =
    document.getElementById(
      'namaDriver'
    ).value.trim();


  const plat =
    document.getElementById(
      'platNo'
    ).value.trim();


  const vendor =
    document.getElementById(
      'vendor'
    ).value;


  const keterangan =
    document.getElementById(
      'keterangan'
    ).value;


  /*
  REASON MANUAL
  */
  const reason =
    document.getElementById(
      'reason'
    ).value.trim();


  if(!tanggal){

    return showStatus(
      'Tanggal wajib diisi.',
      'error'
    );

  }


  if(!driver){

    return showStatus(
      'Nama Driver wajib diisi.',
      'error'
    );

  }


  if(!plat){

    return showStatus(
      'Plat No wajib diisi.',
      'error'
    );

  }


  if(!vendor){

    return showStatus(
      'Vendor wajib dipilih.',
      'error'
    );

  }


  if(
    currentProcess ===
    'RETURN' &&
    !keterangan
  ){

    return showStatus(
      'Keterangan Return wajib dipilih.',
      'error'
    );

  }


  /*
  REASON WAJIB KHUSUS RETURN
  */
  if(
    currentProcess ===
    'RETURN' &&
    !reason
  ){

    return showStatus(
      'Reason wajib diisi.',
      'error'
    );

  }


  if(!photoBase64){

    return showStatus(
      'Foto Driver wajib diambil.',
      'error'
    );

  }


  if(
    scannedAwbs.length === 0
  ){

    return showStatus(
      'Belum ada AWB.',
      'error'
    );

  }


  const btn =
    document.getElementById(
      'btnSave'
    );


  btn.disabled =
    true;


  btn.textContent =
    'MENYIMPAN...';


  try{


    await stopScanner();


    closePhotoCamera();


    const payload = {

      action:
        'save',

      process:
        currentProcess,

      tanggal:
        tanggal,

      namaDriver:
        driver,

      platNo:
        plat,

      vendor:
        vendor,

      keterangan:
        keterangan,

      /*
      REASON DIKIRIM KE APPS SCRIPT
      */
      reason:
        reason,

      awbs:
        scannedAwbs,

      fotoDriver:
        photoBase64

    };


    const response =
      await fetch(

        API_URL,

        {

          method:
            'POST',

          headers:{
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    const responseText =
      await response.text();


    const result =
      JSON.parse(
        responseText
      );


    if(
      !result.success
    ){

      throw new Error(
        result.message ||
        'Gagal menyimpan.'
      );

    }


    alert(
      result.jumlah +
      ' AWB berhasil disimpan ke ' +
      result.sheet
    );


    /*
    SETELAH BERHASIL
    KEMBALI KE MENU DEPAN
    */
    resetApplication();


  }catch(error){


    console.error(error);


    showStatus(
      'Gagal menyimpan: '+
      error.message,
      'error'
    );


  }finally{


    btn.disabled =
      false;


    btn.textContent =
      '💾 SIMPAN DATA';


  }

}


/* =====================================================
STATUS
===================================================== */

function showStatus(
  message,
  type
){

  const status =
    document.getElementById(
      'status'
    );


  status.className =
    'status '+type;


  status.textContent =
    message;

}


function clearStatus(){

  const status =
    document.getElementById(
      'status'
    );


  status.className =
    'status';


  status.textContent =
    '';

}

</script>
